name: Build MobileVLCKit

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after successful builds"
        required: false
        default: false
        type: boolean
      release_title:
        description: "Release title (if creating release)"
        required: false
        default: "MobileVLCKit all Apple platforms build"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            flag: ""
            artifact: MobileVLCKit-iOS
            xcframework_path: build/iOS/VLCKit.xcframework
          - platform: tvOS
            flag: "-t"
            artifact: MobileVLCKit-tvOS
            xcframework_path: build/tvOS/VLCKit.xcframework
          - platform: macOS
            flag: "-x"
            artifact: MobileVLCKit-macOS
            xcframework_path: build/macOS/VLCKit.xcframework
          - platform: watchOS
            flag: "-w"
            artifact: MobileVLCKit-watchOS
            xcframework_path: build/watchOS/VLCKit.xcframework
          - platform: xrOS
            flag: "-i"
            artifact: MobileVLCKit-xrOS
            xcframework_path: build/xrOS/VLCKit.xcframework

    steps:
      - name: Checkout VLCKit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          which python3
          python3 --version
          df -h

      - name: Prepare patched VLC source
        shell: bash
        run: |
          set -euxo pipefail

          echo "Read TESTEDHASH from compileAndBuildVLCKit.sh"
          VLC_TESTED_HASH="$(grep '^TESTEDHASH=' ./compileAndBuildVLCKit.sh | head -1 | cut -d= -f2 | tr -d '"' | awk '{print $1}')"
          echo "Using VLC tested hash: ${VLC_TESTED_HASH}"

          echo "Prepare libvlc/vlc directory"
          mkdir -p libvlc
          rm -rf libvlc/vlc

          echo "Clone VLC source"
          git clone https://code.videolan.org/videolan/vlc.git libvlc/vlc

          echo "Checkout tested VLC hash"
          cd libvlc/vlc
          git checkout -B localBranch "${VLC_TESTED_HASH}"

          echo "Apply VLCKit VLC patches"
          git am ../../libvlc/patches/*.patch

          echo "Patch GNU mirror fallback URL for extras/tools"
          if [ -f extras/tools/packages.mak ]; then
            perl -0pi -e 's#https://ftpmirror\.gnu\.org/gnu#https://ftp.gnu.org/gnu#g; s#http://ftpmirror\.gnu\.org/gnu#https://ftp.gnu.org/gnu#g' extras/tools/packages.mak
          fi

          echo "Show gettext lines after patch"
          grep -n "gettext" extras/tools/packages.mak || true

      - name: Build VLCKit for ${{ matrix.platform }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./compileAndBuildVLCKit.sh
          ./compileAndBuildVLCKit.sh -r -f ${{ matrix.flag }} -a aarch64 -e "$PWD/libvlc/vlc" 2>&1 | tee vlckit-build.log

      - name: Summarize possible errors
        if: always()
        shell: bash
        run: |
          echo "===== possible errors ====="
          if [ -f vlckit-build.log ]; then
            grep -nEi "error:|fatal:|No such file|not found|failed|Error [0-9]|make\\[[0-9]+\\]: \\*\\*\\*" vlckit-build.log | tail -300 || true
          else
            echo "vlckit-build.log not found"
          fi

          echo "===== possible outputs ====="
          find . -maxdepth 8 \( \
            -name "*.framework" -o \
            -name "*.xcframework" -o \
            -name "*.a" -o \
            -name "*.zip" -o \
            -name "*.log" \
          \) -print || true

          df -h

      - name: Upload VLCKit artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 3
          path: |
            vlckit-build.log
            ${{ matrix.xcframework_path }}

  release:
    if: ${{ inputs.create_release == true }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: |
          set -eux
          find downloaded-artifacts -maxdepth 10 -print

      - name: Package release assets
        run: |
          set -eux

          mkdir -p release-assets

          tar -czf release-assets/MobileVLCKit-all-platforms-artifact.tar.gz -C downloaded-artifacts .

          # Add checksum file.
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

          echo "===== release assets ====="
          find release-assets -maxdepth 2 -type f -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eux
          RELEASE_TAG="vlckit-all-platforms-run-${RUN_ID}"
          SOURCE_SHA="${{ github.sha }}"
          echo "Source build commit: $SOURCE_SHA"

          cat > release-notes.md <<EOF
          MobileVLCKit all Apple platforms artifact release.

          Source workflow run id: $RUN_ID
          Source commit: $SOURCE_SHA

          Created from GitHub Actions build.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists. Uploading assets with --clobber."
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" \
              --clobber
          else
            echo "Creating new release."
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
