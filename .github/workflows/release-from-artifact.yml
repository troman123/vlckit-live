name: Release MobileVLCKit Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Build MobileVLCKit workflow run id'
        required: true
        type: string
      release_tag:
        description: 'Release tag, example: vlckit-arm64-2026-06-18-1'
        required: true
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: 'MobileVLCKit arm64 build'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: MobileVLCKit-arm64
          path: downloaded-artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Show downloaded files
        run: |
          find downloaded-artifacts -maxdepth 10 -print

      - name: Package release assets
        run: |
          set -eux

          mkdir -p release-assets

          tar -czf "release-assets/MobileVLCKit-arm64-artifact.tar.gz" -C downloaded-artifacts .

          find downloaded-artifacts -type f \( \
            -name "*.zip" -o \
            -name "*.log" -o \
            -name "*.a" \
          \) -exec cp {} release-assets/ \;

          find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -eux

          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TITLE" \
            --notes "MobileVLCKit arm64 artifact release.

          Source workflow run id: $SOURCE_RUN_ID
          Created from GitHub Actions artifact.
          "